<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irrigação automática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060d1a;
    --texto: #eef3ff;
    --suave: #8c9bbd;
    --borda: rgba(255,255,255,0.08);
    --vidro: rgba(255,255,255,0.04);
    --seco: #f05252;
    --ideal: #2fd27a;
    --encharcado: #4c8dff;
    --destaque: #5cc8ff;
    --fonte: "Outfit", Bahnschrift, "Segoe UI", system-ui, sans-serif;
    /* cena */
    --mesa: #c9a97f; --mesa-borda: #b08e63; --vidro-borda: #7f97ab; --tubo: #7b8a97; --vapor: rgba(90,110,130,.45);
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 600px at 50% 35%, rgba(40,90,170,.35), transparent 70%),
      radial-gradient(1400px 900px at 50% 120%, rgba(10,40,90,.6), transparent 70%);
    background-attachment: fixed;
  }
  body {
    margin: 0; min-height: 100vh; background: transparent; color: var(--texto);
    font-family: var(--fonte); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--fonte); font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; gap: 10px; padding: 18px 28px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 400; color: var(--suave); letter-spacing: .3px; flex: 1; }
  button {
    font: inherit; font-size: 14px; color: var(--texto); cursor: pointer;
    background: var(--vidro); border: 1px solid var(--borda); padding: 8px 16px; border-radius: 999px;
  }
  button:hover { background: rgba(255,255,255,0.1); }
  button.icone { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; }
  button.icone svg { width: 18px; height: 18px; }

  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; align-items: center;
    padding: 0 28px 28px; max-width: 1500px; width: 100%; margin: 0 auto;
  }
  .cena-cartao {
    border-radius: 24px; overflow: hidden; border: 1px solid var(--borda);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  #cena { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); }

  .painel { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #velocimetro { width: 100%; max-width: 300px; height: auto; display: block; }
  .pilulas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .estado, .bomba {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 500; padding: 7px 18px; border-radius: 999px; transition: .3s;
  }
  .estado.seco { color: var(--seco); background: rgba(240,82,82,.12); }
  .estado.ideal { color: var(--ideal); background: rgba(47,210,122,.12); }
  .estado.encharcado { color: var(--encharcado); background: rgba(76,141,255,.14); }
  .bomba { color: var(--suave); background: rgba(255,255,255,.05); }
  .bomba i { width: 9px; height: 9px; border-radius: 50%; background: #64748b; transition: .3s; }
  .bomba.ligada { color: var(--destaque); background: rgba(92,200,255,.12); }
  .bomba.ligada i { background: var(--destaque); box-shadow: 0 0 10px var(--destaque); }

  .controle { width: 100%; margin-top: 10px; }
  .controle label { display: flex; justify-content: space-between; font-size: 14px; color: var(--suave); margin-bottom: 12px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px; outline: none; cursor: pointer; margin: 0;
    background: linear-gradient(90deg, var(--seco) 0 30%, var(--ideal) 30% 60%, var(--encharcado) 60% 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #f8fafc;
    border: 5px solid #0b1528; box-shadow: 0 0 0 1px rgba(255,255,255,.4);
  }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #f8fafc; border: 5px solid #0b1528; }
  .regra { margin: 6px 0 0; color: var(--suave); font-size: 15px; font-weight: 300; text-align: center; line-height: 1.5; }
  .regra b { font-weight: 500; }

  /* animações da cena */
  .balanco { animation: balanco 5s ease-in-out infinite; }
  @keyframes balanco { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
  .raios { animation: girar 40s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .gota, .respingo, .fluxo, .sinal, .vapor { opacity: 0; }
  .regando .gota { animation: cair .9s cubic-bezier(.5, 0, 1, 1) infinite; }
  .regando .respingo { animation: respingar .9s ease-out infinite; }
  .regando .fluxo, .regando .sinal { opacity: 1; animation: fluir .7s linear infinite; }
  .regando .helice { animation: girar .5s linear infinite; }
  .evaporando .vapor { animation: subir 3.2s ease-in infinite; }
  @keyframes cair { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  @keyframes respingar { 0%, 70% { transform: scale(.2); opacity: 0; } 80% { opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }
  @keyframes fluir { to { stroke-dashoffset: -16; } }
  @keyframes subir { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-34px); opacity: 0; } }
  .gota, .respingo, .vapor, .helice { transform-box: fill-box; transform-origin: center; }
  .particula { transition: opacity .6s; }
  .nuvem { animation: nuvem linear infinite; }
  @keyframes nuvem { from { transform: translate(-80px, 70px); } to { transform: translate(800px, 70px); } }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; padding: 0 16px 24px; }
    header { padding: 14px 16px; }
    .painel { max-width: 420px; width: 100%; margin: 0 auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Irrigação automática · simulação</h1>
  <button id="btnTela" class="icone" title="Tela cheia (tecla F)" aria-label="Tela cheia">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>

<main>
  <div class="cena-cartao">
    <svg id="cena" viewBox="0 0 720 460" role="img" aria-label="Vaso de vidro com planta, sensor de umidade e reservatório com bomba">
      <defs>
        <linearGradient id="gCeu" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6fbef0"/><stop offset="1" stop-color="#d4ecfb"/>
        </linearGradient>
        <radialGradient id="gBrilho">
          <stop offset="0" stop-color="#ffd25e" stop-opacity=".5"/><stop offset="1" stop-color="#ffd25e" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gSolo" x1="0" y1="0" x2="0" y2="1">
          <stop id="solo1" offset="0" stop-color="#c8784e"/><stop id="solo2" offset="1" stop-color="#a05a36"/>
        </linearGradient>
        <linearGradient id="gUmido" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4aa8f0" stop-opacity="0"/><stop offset=".35" stop-color="#2f8fe0" stop-opacity=".3"/><stop offset="1" stop-color="#1f6fc0" stop-opacity=".55"/>
        </linearGradient>
        <linearGradient id="gFolha" x1="0" y1="0" x2="1" y2="1">
          <stop id="folha1" offset="0" stop-color="#72c785"/><stop id="folha2" offset="1" stop-color="#2d8649"/>
        </linearGradient>
        <linearGradient id="gVidro" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".18" stop-color="#ffffff" stop-opacity=".04"/>
          <stop offset=".82" stop-color="#ffffff" stop-opacity=".02"/><stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
        </linearGradient>
        <linearGradient id="gAgua" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5db7f5" stop-opacity=".8"/><stop offset="1" stop-color="#1f6fc0" stop-opacity=".9"/>
        </linearGradient>
        <clipPath id="clipVaso"><path d="M173 252 L387 252 L368 396 L192 396 Z"/></clipPath>
        <clipPath id="clipReserva"><rect x="473" y="262" width="84" height="134" rx="6"/></clipPath>
        <path id="folhaForma" d="M0 0 C13 -15 36 -17 52 0 C36 13 13 12 0 0 Z"/>
      </defs>

      <rect width="720" height="460" fill="url(#gCeu)"/>
      <!-- nuvens -->
      <g fill="#ffffff">
        <g class="nuvem" style="animation-duration: 70s; animation-delay: -10s" opacity=".95">
          <ellipse cx="0" cy="0" rx="46" ry="16"/><circle cx="-16" cy="-10" r="18"/><circle cx="14" cy="-14" r="22"/>
        </g>
        <g class="nuvem" style="animation-duration: 95s; animation-delay: -55s" opacity=".85">
          <ellipse cx="0" cy="0" rx="36" ry="12" transform="translate(0 50)"/><circle cx="-10" cy="42" r="14"/><circle cx="12" cy="38" r="17"/>
        </g>
        <g class="nuvem" style="animation-duration: 120s; animation-delay: -30s" opacity=".7">
          <ellipse cx="0" cy="0" rx="30" ry="10" transform="translate(0 -20)"/><circle cx="-8" cy="-27" r="11"/><circle cx="10" cy="-30" r="14"/>
        </g>
      </g>

      <!-- sol -->
      <g id="sol">
        <circle cx="92" cy="82" r="78" fill="url(#gBrilho)"/>
        <g class="raios" style="transform-box: view-box; transform-origin: 92px 82px" stroke="#ffc94a" stroke-width="4" stroke-linecap="round">
          <line x1="92" y1="38" x2="92" y2="48"/><line x1="92" y1="116" x2="92" y2="126"/>
          <line x1="48" y1="82" x2="58" y2="82"/><line x1="126" y1="82" x2="136" y2="82"/>
          <line x1="61" y1="51" x2="68" y2="58"/><line x1="116" y1="106" x2="123" y2="113"/>
          <line x1="123" y1="51" x2="116" y2="58"/><line x1="68" y1="106" x2="61" y2="113"/>
        </g>
        <circle cx="92" cy="82" r="26" fill="#ffc94a"/>
      </g>

      <!-- mesa -->
      <rect x="0" y="398" width="720" height="62" style="fill: var(--mesa)"/>
      <rect x="0" y="398" width="720" height="3" style="fill: var(--mesa-borda)"/>
      <ellipse cx="280" cy="403" rx="118" ry="6" fill="#000" opacity=".25"/>
      <ellipse cx="515" cy="403" rx="52" ry="5" fill="#000" opacity=".25"/>
      <ellipse cx="640" cy="401" rx="44" ry="4" fill="#000" opacity=".25"/>

      <!-- cabos do sensor até a ESP32 (passam por trás do reservatório) -->
      <g fill="none" stroke-width="2" stroke-linecap="round" opacity=".85">
        <path d="M352 224 C 352 150, 600 150, 622 352" stroke="#e05a4a"/>
        <path d="M359 224 C 359 158, 606 158, 630 352" stroke="#4a4a52"/>
        <path d="M366 224 C 366 166, 612 166, 638 352" stroke="#e0b23a"/>
      </g>
      <!-- sinal da ESP32 até a bomba -->
      <path d="M600 380 C 580 420, 540 420, 532 392" fill="none" stroke="#e0b23a" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" opacity=".5"/>
      <path class="sinal" d="M600 380 C 580 420, 540 420, 532 392" fill="none" stroke="#ffcf4a" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round"/>

      <!-- solo, umidade e raízes dentro do vaso -->
      <g clip-path="url(#clipVaso)">
        <path d="M160 274 Q200 267 240 272 T320 271 T400 272 L400 410 L160 410 Z" fill="url(#gSolo)"/>
        <rect id="umidadeSolo" x="160" y="396" width="240" height="0" fill="url(#gUmido)"/>
        <g id="particulas"></g>
        <g stroke="#f3dcc4" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".6">
          <path d="M280 274 C278 300 268 318 252 336"/><path d="M280 274 C284 304 296 322 312 342"/>
          <path d="M279 290 C266 300 250 304 236 302"/><path d="M281 296 C294 306 312 310 330 306"/>
          <path d="M262 326 C256 340 250 352 246 366"/><path d="M302 332 C310 346 314 358 316 372"/>
          <path d="M280 300 C280 330 282 350 280 378"/>
        </g>
        <g>
          <ellipse class="respingo" style="animation-delay: 0s" cx="322" cy="273" rx="12" ry="3" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
          <ellipse class="respingo" style="animation-delay: .3s" cx="322" cy="273" rx="12" ry="3" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
          <ellipse class="respingo" style="animation-delay: .6s" cx="322" cy="273" rx="12" ry="3" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
        </g>
      </g>

      <!-- vapor -->
      <g stroke-width="2.2" fill="none" stroke-linecap="round" style="stroke: var(--vapor)">
        <path class="vapor" style="animation-delay: 0s" d="M230 262 c-6 -7 6 -13 0 -20 c-6 -7 6 -13 0 -20"/>
        <path class="vapor" style="animation-delay: 1.1s" d="M300 262 c-6 -7 6 -13 0 -20 c-6 -7 6 -13 0 -20"/>
        <path class="vapor" style="animation-delay: 2.1s" d="M330 262 c-6 -7 6 -13 0 -20 c-6 -7 6 -13 0 -20"/>
      </g>

      <!-- planta -->
      <g id="planta" class="balanco" style="transform-box: view-box; transform-origin: 280px 272px">
        <path id="caule" d="M280 272 Q280 190 280 112" stroke="#3a8a4f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g id="folhas"></g>
        <circle id="broto" cx="280" cy="112" r="5" fill="#3a8a4f"/>
      </g>

      <!-- vaso de vidro -->
      <path d="M170 250 L390 250 L370 398 L190 398 Z" fill="url(#gVidro)" stroke-width="2.5" stroke-linejoin="round" style="stroke: var(--vidro-borda)"/>
      <rect x="164" y="244" width="232" height="10" rx="5" style="fill: var(--vidro-borda)"/>
      <path d="M184 262 L198 384" stroke="#ffffff" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>

      <!-- sensor capacitivo (lado direito do vaso) -->
      <g id="sensor">
        <path d="M348 262 L370 262 L366 340 Q359 348 352 340 Z" fill="#1f3354"/>
        <path d="M353 270 L355 334" stroke="#d6b25a" stroke-width="1.4" opacity=".8"/>
        <rect x="340" y="224" width="38" height="42" rx="5" fill="#27426f"/>
        <rect x="348" y="232" width="13" height="11" rx="2" fill="#101b2e"/>
        <circle id="ledSensor" cx="370" cy="234" r="2.6" fill="#ff6b5e"/>
      </g>

      <!-- reservatório com bomba submersa -->
      <rect x="470" y="258" width="90" height="140" rx="8" fill="url(#gVidro)" stroke-width="2.5" style="stroke: var(--vidro-borda)"/>
      <g clip-path="url(#clipReserva)">
        <rect id="aguaCorpo" x="460" y="300" width="110" height="120" fill="url(#gAgua)"/>
        <path id="aguaOnda" d="M400 300 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 v8 h-200 z" fill="#5db7f5" opacity=".9"/>
        <rect x="494" y="366" width="42" height="28" rx="6" fill="#26374a"/>
        <g class="helice">
          <circle cx="515" cy="380" r="8" fill="#3b5470"/>
          <path d="M515 373 v14 M508 380 h14" stroke="#9fb6cc" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ESP32 (canto direito, na mesa) -->
      <g id="esp">
        <rect x="596" y="352" width="88" height="44" rx="7" fill="#15233b" stroke="#3d5a85" stroke-width="1.5"/>
        <rect x="606" y="360" width="32" height="22" rx="3" fill="#aab4c0"/>
        <path d="M646 362 h8 v5 h-5 v5 h5 v5 h-8" fill="none" stroke="#d6b25a" stroke-width="1.6"/>
        <circle id="ledEsp" cx="672" cy="362" r="3.5" fill="#33443a"/>
        <text x="640" y="392" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="600" font-size="9" fill="#9fb0cf" letter-spacing="1">ESP32</text>
      </g>

      <!-- cano, fluxo e gotejador -->
      <path d="M515 366 L515 222 Q515 210 503 210 L334 210 Q322 210 322 222 L322 236" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--tubo)"/>
      <path class="fluxo" d="M515 366 L515 222 Q515 210 503 210 L334 210 Q322 210 322 222 L322 236" fill="none" stroke="#7cc8ff" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
      <rect x="314" y="234" width="16" height="10" rx="3" style="fill: var(--tubo)"/>
      <g fill="#5bb4f5">
        <path class="gota" style="animation-delay: 0s" d="M322 246 q4.5 6.5 0 9.5 q-4.5 -3 0 -9.5z"/>
        <path class="gota" style="animation-delay: .3s" d="M322 246 q4.5 6.5 0 9.5 q-4.5 -3 0 -9.5z"/>
        <path class="gota" style="animation-delay: .6s" d="M322 246 q4.5 6.5 0 9.5 q-4.5 -3 0 -9.5z"/>
      </g>

      <!-- etiquetas -->
      <g font-family="Outfit, sans-serif" font-size="12" fill="#6b5537" text-anchor="middle">
        <text x="280" y="428">vaso de vidro com terra vermelha</text>
        <text x="515" y="428">reservatório e bomba</text>
      </g>
    </svg>
  </div>

  <aside class="painel">
    <svg id="velocimetro" viewBox="0 0 400 334" role="img" aria-label="Velocímetro de umidade">
      <defs>
        <filter id="brilhoP" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="centro" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#1b335a" stop-opacity=".9"/><stop offset="1" stop-color="#0b1730" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="190" r="178" fill="url(#centro)"/>
      <g id="faixas"></g>
      <g id="marcas"></g>
      <g id="ponteiro" filter="url(#brilhoP)"><polygon points="0,-5 150,0 0,5 -22,0" fill="#f8fafc"/></g>
      <circle cx="200" cy="190" r="14" fill="#0b1528" stroke="#f8fafc" stroke-width="4"/>
      <text id="valor" class="num" x="200" y="298" text-anchor="middle" fill="#f8fafc" font-size="62" font-weight="600">--</text>
      <text x="200" y="326" text-anchor="middle" fill="#8c9bbd" font-size="13" letter-spacing="3" style="font-family:var(--fonte)">UMIDADE DO SOLO</text>
    </svg>

    <div class="pilulas">
      <div id="estado" class="estado ideal">Ideal</div>
      <div id="bomba" class="bomba"><i></i><span>Bomba desligada</span></div>
    </div>

    <div class="controle">
      <label for="barra"><span>Mude a umidade</span><span>arraste</span></label>
      <input id="barra" type="range" min="0" max="100" step="0.5" value="45">
    </div>
    <p class="regra">Abaixo de <b style="color:var(--seco)">30%</b> a bomba liga.<br>Acima de <b style="color:var(--encharcado)">60%</b> ela desliga.</p>
  </aside>
</main>

<script>
(() => {
  "use strict";
  const LIMITE_SECO = 30, LIMITE_ENCHARCADO = 60;
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  /* ---------- estado ---------- */
  let umidade = 45, vis = 45, bomba = false, reserva = 100, arrastando = false;

  /* ---------- simulação: 10 passos por segundo ---------- */
  setInterval(() => {
    if (!arrastando) {
      umidade += bomba ? 1.0 : -0.4;            // a bomba molha, o sol seca (tempo acelerado)
      umidade = Math.min(100, Math.max(0, umidade));
    }
    // regra com histerese, igual à ESP32
    if (!bomba && umidade < LIMITE_SECO) bomba = true;
    else if (bomba && umidade > LIMITE_ENCHARCADO) bomba = false;
    reserva = bomba ? Math.max(18, reserva - 0.25) : Math.min(100, reserva + 0.1);
  }, 100);

  /* ---------- planta ---------- */
  const FOLHAS = [
    { t: .22, lado: -1, s: 1.15 }, { t: .34, lado: 1, s: 1.12 }, { t: .5, lado: -1, s: 1 },
    { t: .63, lado: 1, s: .95 }, { t: .78, lado: -1, s: .8 }, { t: .88, lado: 1, s: .68 }
  ];
  const folhaEls = FOLHAS.map(() => {
    const g = document.createElementNS(NS, "g");
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#folhaForma"); u.setAttribute("fill", "url(#gFolha)");
    const v = document.createElementNS(NS, "path");
    v.setAttribute("d", "M3 0 Q26 -2 48 0"); v.setAttribute("stroke", "#ffffff");
    v.setAttribute("stroke-opacity", ".35"); v.setAttribute("stroke-width", "1.2"); v.setAttribute("fill", "none");
    g.append(u, v); $("folhas").appendChild(g);
    return g;
  });

  /* gotas de água no solo: aparecem conforme a umidade sobe */
  const particulas = [];
  for (let i = 0; i < 46; i++) {
    const y = 284 + Math.random() * 106;
    const meia = 98 - (y - 252) * 0.135;
    const x = 280 + (Math.random() * 2 - 1) * (meia - 8);
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("r", (1.6 + Math.random() * 1.8).toFixed(1));
    c.setAttribute("fill", "#7cc8ff"); c.setAttribute("class", "particula"); c.setAttribute("opacity", "0");
    $("particulas").appendChild(c);
    particulas.push({ el: c, limiar: (1 - (y - 284) / 106) * 0.75 + Math.random() * 0.25 });
  }

  const mistura = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
  const bezier = (p0, p1, p2, t) => { const m = 1 - t; return [m*m*p0[0] + 2*m*t*p1[0] + t*t*p2[0], m*m*p0[1] + 2*m*t*p1[1] + t*t*p2[1]]; };

  /* ---------- velocímetro (igual ao medidor) ---------- */
  const CX = 200, CY = 190, R = 150, INICIO = 135, VARREDURA = 270;
  const ang = (v) => INICIO + VARREDURA * v / 100;
  const ponto = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  function arco(v1, v2, r) {
    const a1 = ang(v1), a2 = ang(v2), [x1, y1] = ponto(a1, r), [x2, y2] = ponto(a2, r);
    return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  }
  function el(tag, attrs, pai) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); pai.appendChild(e); return e; }
  const FAIXAS = [
    { de: 0, ate: LIMITE_SECO, cor: "var(--seco)", nome: "seco", texto: "Seco" },
    { de: LIMITE_SECO, ate: LIMITE_ENCHARCADO, cor: "var(--ideal)", nome: "ideal", texto: "Ideal" },
    { de: LIMITE_ENCHARCADO, ate: 100, cor: "var(--encharcado)", nome: "encharcado", texto: "Encharcado" },
  ];
  const arcos = {};
  el("path", { d: arco(0, 100, R), stroke: "rgba(255,255,255,.06)", "stroke-width": 30, fill: "none" }, $("faixas"));
  for (const f of FAIXAS) arcos[f.nome] = el("path", { d: arco(f.de + .5, f.ate - .5, R), stroke: f.cor, "stroke-width": 24, fill: "none", opacity: .4, style: "transition: opacity .4s, stroke-width .4s" }, $("faixas"));
  for (let v = 0; v <= 100; v += 2) {
    const g = v % 10 === 0, [x1, y1] = ponto(ang(v), R - 22), [x2, y2] = ponto(ang(v), R - (g ? 34 : 27));
    el("line", { x1, y1, x2, y2, stroke: g ? "#cbd5e1" : "rgba(203,213,225,.3)", "stroke-width": g ? 2.2 : 1.1, "stroke-linecap": "round" }, $("marcas"));
    if (g) { const [tx, ty] = ponto(ang(v), R - 52); el("text", { x: tx, y: ty + 5, "text-anchor": "middle", fill: "#8c9bbd", "font-size": 14, class: "num" }, $("marcas")).textContent = v; }
  }

  /* ---------- desenho (60 quadros por segundo) ---------- */
  const barra = $("barra");
  let ultimaChave = "";
  function desenhar() {
    vis += (umidade - vis) * 0.12;
    const u = vis, t = u / 100;

    // terra vermelha: clara quando seca, escura quando molhada
    $("solo1").setAttribute("stop-color", rgb(mistura([206, 128, 84], [96, 42, 26], t)));
    $("solo2").setAttribute("stop-color", rgb(mistura([170, 96, 58], [64, 26, 16], t)));
    $("umidadeSolo").setAttribute("y", 396 - u * 1.25);
    $("umidadeSolo").setAttribute("height", u * 1.25 + 4);
    particulas.forEach((p) => p.el.setAttribute("opacity", t > p.limiar ? ".85" : "0"));

    // planta murcha e amarela quando seca
    const seca = Math.max(0, Math.min(1, (LIMITE_SECO + 8 - u) / (LIMITE_SECO + 8)));
    $("folha1").setAttribute("stop-color", rgb(mistura([114, 199, 133], [214, 190, 104], seca)));
    $("folha2").setAttribute("stop-color", rgb(mistura([45, 134, 73], [150, 118, 52], seca)));
    const corCaule = rgb(mistura([58, 138, 79], [128, 112, 60], seca));
    $("caule").setAttribute("stroke", corCaule); $("broto").setAttribute("fill", corCaule);
    const p0 = [280, 272], p1 = [280, 196], p2 = [280 + seca * 42, 112 + seca * 34];
    $("caule").setAttribute("d", `M${p0} Q${p1} ${p2}`);
    $("broto").setAttribute("cx", p2[0]); $("broto").setAttribute("cy", p2[1]);
    const queda = seca * 48;
    FOLHAS.forEach((f, i) => {
      const [x, y] = bezier(p0, p1, p2, f.t);
      const a = f.lado === 1 ? -30 + queda : 30 - queda;
      folhaEls[i].setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${f.lado * f.s} ${f.s})`);
    });

    // reservatório
    const nivel = 392 - reserva * 1.22;
    $("aguaCorpo").setAttribute("y", nivel);
    $("aguaOnda").setAttribute("transform", `translate(${(performance.now() / 40) % 40} ${nivel - 300})`);

    const cena = $("cena");
    cena.classList.toggle("regando", bomba);
    cena.classList.toggle("evaporando", !bomba);
    $("sol").setAttribute("opacity", bomba ? .35 : 1);
    $("ledEsp").setAttribute("fill", bomba ? "#3ef08a" : "#33443a");
    $("ledSensor").setAttribute("opacity", (performance.now() / 500 | 0) % 2 ? 1 : .35);

    // velocímetro
    $("ponteiro").setAttribute("transform", `translate(${CX} ${CY}) rotate(${ang(u).toFixed(2)})`);
    $("valor").textContent = Math.round(u) + "%";
    if (!arrastando) barra.value = umidade.toFixed(1);

    const f = u < LIMITE_SECO ? FAIXAS[0] : u > LIMITE_ENCHARCADO ? FAIXAS[2] : FAIXAS[1];
    const chave = f.nome + bomba;
    if (chave !== ultimaChave) {
      ultimaChave = chave;
      $("estado").className = "estado " + f.nome; $("estado").textContent = f.texto;
      for (const x of FAIXAS) { arcos[x.nome].setAttribute("opacity", x === f ? 1 : .3); arcos[x.nome].setAttribute("stroke-width", x === f ? 30 : 22); }
      $("bomba").className = "bomba" + (bomba ? " ligada" : "");
      $("bomba").querySelector("span").textContent = bomba ? "Bomba ligada" : "Bomba desligada";
    }
    requestAnimationFrame(desenhar);
  }
  requestAnimationFrame(desenhar);

  /* ---------- barra: segura só enquanto o dedo/mouse está nela ---------- */
  barra.addEventListener("input", () => { umidade = parseFloat(barra.value); });
  barra.addEventListener("pointerdown", () => { arrastando = true; });
  const soltar = () => { arrastando = false; };
  window.addEventListener("pointerup", soltar);
  window.addEventListener("pointercancel", soltar);
  barra.addEventListener("change", soltar);

  /* ---------- tela cheia ---------- */
  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  $("btnTela").addEventListener("click", telaCheia);
  document.addEventListener("keydown", (e) => { if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.altKey) telaCheia(); });
})();
</script>
</body>
</html>
